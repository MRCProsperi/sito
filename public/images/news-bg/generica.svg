<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 640" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1F325A"/>
      <stop offset="1" stop-color="#16264a"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F7A211" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#F7A211" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1920" height="640" fill="url(#bg)"/>
  <polygon points="0,0 900,0 420,640 0,640" fill="url(#beam)" opacity="0.28"/>

  <!-- half court seen from above, baseline on top. Scale: 1 m = 40 px, basket at (1500, 123) -->
  <g transform="translate(1500 60)" fill="none" stroke="#fff" stroke-opacity="0.28" stroke-width="5" stroke-linecap="round">
    <!-- baseline -->
    <line x1="-420" y1="0" x2="420" y2="0"/>
    <!-- paint (4.9 m x 5.8 m) -->
    <rect x="-98" y="0" width="196" height="232"/>
    <!-- free-throw circle (r 1.8 m) -->
    <path d="M -72 232 A 72 72 0 0 0 72 232"/>
    <path d="M -72 232 A 72 72 0 0 1 72 232" stroke-dasharray="14 12"/>
    <!-- three-point line: corner lines + arc (r 6.75 m) -->
    <line x1="-264" y1="0" x2="-264" y2="120"/>
    <line x1="264" y1="0" x2="264" y2="120"/>
    <path d="M -264 120 A 270 270 0 0 0 264 120"/>
    <!-- restricted area arc (r 1.25 m) -->
    <path d="M -50 63 A 50 50 0 0 0 50 63"/>
    <!-- backboard and hoop -->
    <line x1="-30" y1="48" x2="30" y2="48" stroke-width="8"/>
    <circle cx="0" cy="63" r="9" stroke="#F7A211" stroke-opacity="0.8"/>
  </g>
  <rect x="0" y="600" width="1920" height="40" fill="#F7A211" opacity="0.9"/>
</svg>
