<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 640" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c1530"/>
      <stop offset="0.55" stop-color="#1F325A"/>
      <stop offset="1" stop-color="#14224a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F7A211" stop-opacity="0"/>
      <stop offset="1" stop-color="#F7A211" stop-opacity="0.9"/>
    </linearGradient>
  </defs>
  <rect width="1920" height="640" fill="url(#bg)"/>
  <!-- diagonal gold stripes, right side -->
  <g transform="rotate(-18 1500 320)">
    <rect x="1180" y="-200" width="70" height="1200" fill="url(#gold)" opacity="0.55"/>
    <rect x="1290" y="-200" width="28" height="1200" fill="url(#gold)" opacity="0.8"/>
    <rect x="1360" y="-200" width="140" height="1200" fill="url(#gold)" opacity="0.28"/>
  </g>
  <!-- centre court -->
  <g fill="none" stroke="#F7A211" stroke-opacity="0.35" stroke-width="5">
    <circle cx="520" cy="320" r="230"/>
    <line x1="520" y1="-20" x2="520" y2="660"/>
  </g>
  <rect x="0" y="600" width="1920" height="40" fill="#F7A211" opacity="0.9"/>
</svg>
