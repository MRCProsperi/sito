<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 640" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f56a3"/>
      <stop offset="1" stop-color="#1F325A"/>
    </linearGradient>
    <g id="ball">
      <circle r="100" fill="#F7A211"/>
      <g fill="none" stroke="#1F325A" stroke-width="7" stroke-opacity="0.55">
        <circle r="100"/>
        <line x1="-100" y1="0" x2="100" y2="0"/>
        <line x1="0" y1="-100" x2="0" y2="100"/>
        <path d="M -71 -71 Q -28 0 -71 71"/>
        <path d="M 71 -71 Q 28 0 71 71"/>
      </g>
    </g>
  </defs>
  <rect width="1920" height="640" fill="url(#bg)"/>
  <!-- playful confetti -->
  <g opacity="0.5" fill="#F7A211">
    <circle cx="260" cy="110" r="14"/><circle cx="470" cy="520" r="10"/><circle cx="640" cy="170" r="8"/>
    <circle cx="880" cy="470" r="16"/><circle cx="1010" cy="90" r="9"/><circle cx="1180" cy="560" r="12"/>
    <rect x="360" y="330" width="26" height="26" rx="6" transform="rotate(25 373 343)"/>
    <rect x="760" y="250" width="22" height="22" rx="5" transform="rotate(-20 771 261)"/>
    <rect x="1090" y="300" width="20" height="20" rx="5" transform="rotate(40 1100 310)"/>
  </g>
  <!-- balls -->
  <use href="#ball" transform="translate(1640 170) scale(1.7) rotate(-15)" opacity="0.95"/>
  <use href="#ball" transform="translate(1330 470) scale(0.9) rotate(20)" opacity="0.8"/>
  <use href="#ball" transform="translate(190 480) scale(0.7) rotate(-30)" opacity="0.65"/>
  <rect x="0" y="600" width="1920" height="40" fill="#F7A211" opacity="0.9"/>
</svg>
