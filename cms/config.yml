# Decap CMS: pannello per aggiornare news, partite, classifiche, pagine e foto senza toccare i file.
# Ogni salvataggio crea un commit su GitHub; con il deploy automatico il sito si aggiorna da solo.
# Va attivato seguendo GUIDA-CMS-E-DEPLOY.md (serve un piccolo servizio di login, vedi base_url).

backend:
  name: github
  repo: MRCProsperi/sito
  branch: main
  # Indirizzo del servizio di login OAuth (vedi guida). Da sostituire:
  base_url: https://CAMBIA-CON-IL-TUO-SERVIZIO-DI-LOGIN.workers.dev

locale: it
site_url: https://www.virtusvelletri.it
display_url: https://www.virtusvelletri.it

media_folder: public/images
public_folder: /images

collections:
  # ---------------------------------------------------------------- NEWS
  - name: news
    label: News
    label_singular: News
    folder: content/news
    extension: md
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    media_folder: /public/images/news
    public_folder: /images/news
    summary: "{{date}} · {{title}}"
    sortable_fields: [date, title]
    fields:
      - { label: Titolo, name: title, widget: string }
      - { label: Data, name: date, widget: datetime, format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
      - { label: Descrizione breve, name: description, widget: text, hint: "Compare nell'elenco delle news e quando si condivide il link." }
      - { label: Categoria, name: category, widget: select, options: [{ label: DR1, value: dr1 }, { label: Giovanili, value: giovanili }, { label: Minibasket, value: minibasket }, { label: Generica, value: generica }], default: generica, hint: "Decide lo sfondo della testata della news." }
      - { label: Immagine, name: image, widget: image, required: false, hint: "Compare nell'elenco delle news." }
      - { label: In evidenza (barra news in home), name: featured, widget: boolean, default: true }
      - { label: "Mostra l'immagine dentro la news", name: showImage, widget: boolean, default: false, required: false }
      - { label: "File da scaricare (PDF)", name: downloadPdf, widget: string, required: false, hint: "Solo con 'Mostra l'immagine'. Esempio: /pdf/calendario-dr1-2026-27.pdf" }
      - { label: Testo, name: body, widget: markdown }

  # ---------------------------------------------------------------- PARTITE
  - name: partite
    label: Partite e risultati
    files:
      - name: dr1
        label: DR1
        file: content/matches/dr1.md
        fields:
          - { label: Titolo interno, name: title, widget: string, default: Partite DR1 }
          - { label: Squadra (non cambiare), name: team_slug, widget: string, default: dr1 }
          - label: Partite
            name: events
            widget: list
            summary: "{{fields.date}} · {{fields.title}} {{fields.score}}"
            fields:
              - { label: Partita, name: title, widget: string, hint: "Esempio: Virtus Velletri vs Casilino 23" }
              - { label: Data, name: date, widget: string, pattern: ["^\\d{4}-\\d{2}-\\d{2}$", "Scrivi la data come AAAA-MM-GG, per esempio 2026-10-11"] }
              - { label: Ora, name: time, widget: string, pattern: ["^\\d{1,2}:\\d{2}$", "Scrivi l'ora come HH:MM, per esempio 19:00"] }
              - { label: Luogo, name: location, widget: string }
              - { label: Categoria, name: category, widget: string, default: DR1 }
              - { label: Risultato, name: score, widget: string, required: false, hint: "Dopo la partita, per esempio 78-65" }
      - name: under17
        label: Under 17
        file: content/matches/under-17.md
        fields:
          - { label: Titolo interno, name: title, widget: string, default: Partite U17 }
          - { label: Squadra (non cambiare), name: team_slug, widget: string, default: under-17 }
          - label: Partite
            name: events
            widget: list
            summary: "{{fields.date}} · {{fields.title}} {{fields.score}}"
            fields:
              - { label: Partita, name: title, widget: string }
              - { label: Data, name: date, widget: string, pattern: ["^\\d{4}-\\d{2}-\\d{2}$", "Scrivi la data come AAAA-MM-GG, per esempio 2026-10-20"] }
              - { label: Ora, name: time, widget: string, pattern: ["^\\d{1,2}:\\d{2}$", "Scrivi l'ora come HH:MM, per esempio 18:50"] }
              - { label: Luogo, name: location, widget: string }
              - { label: Categoria, name: category, widget: string, default: Under 17 }
              - { label: Risultato, name: score, widget: string, required: false }
      - name: amatoriale
        label: Amatori
        file: content/matches/amatoriale.md
        fields:
          - { label: Titolo interno, name: title, widget: string, default: Partite Amatori }
          - { label: Squadra (non cambiare), name: team_slug, widget: string, default: amatoriale }
          - label: Partite
            name: events
            widget: list
            required: false
            fields:
              - { label: Partita, name: title, widget: string }
              - { label: Data, name: date, widget: string, pattern: ["^\\d{4}-\\d{2}-\\d{2}$", "Scrivi la data come AAAA-MM-GG"] }
              - { label: Ora, name: time, widget: string, pattern: ["^\\d{1,2}:\\d{2}$", "Scrivi l'ora come HH:MM"] }
              - { label: Luogo, name: location, widget: string }
              - { label: Categoria, name: category, widget: string, default: Amatori }
              - { label: Risultato, name: score, widget: string, required: false }
      - name: under15
        label: Under 15
        file: content/matches/under-15.md
        fields:
          - { label: Titolo interno, name: title, widget: string, default: Partite U15 }
          - { label: Squadra (non cambiare), name: team_slug, widget: string, default: under-15 }
          - label: Partite
            name: events
            widget: list
            required: false
            fields:
              - { label: Partita, name: title, widget: string }
              - { label: Data, name: date, widget: string, pattern: ["^\\d{4}-\\d{2}-\\d{2}$", "Scrivi la data come AAAA-MM-GG"] }
              - { label: Ora, name: time, widget: string, pattern: ["^\\d{1,2}:\\d{2}$", "Scrivi l'ora come HH:MM"] }
              - { label: Luogo, name: location, widget: string }
              - { label: Categoria, name: category, widget: string, default: Under 15 }
              - { label: Risultato, name: score, widget: string, required: false }
      - name: under14
        label: Under 14
        file: content/matches/under-14.md
        fields:
          - { label: Titolo interno, name: title, widget: string, default: Partite U14 }
          - { label: Squadra (non cambiare), name: team_slug, widget: string, default: under-14 }
          - label: Partite
            name: events
            widget: list
            required: false
            fields:
              - { label: Partita, name: title, widget: string }
              - { label: Data, name: date, widget: string, pattern: ["^\\d{4}-\\d{2}-\\d{2}$", "Scrivi la data come AAAA-MM-GG"] }
              - { label: Ora, name: time, widget: string, pattern: ["^\\d{1,2}:\\d{2}$", "Scrivi l'ora come HH:MM"] }
              - { label: Luogo, name: location, widget: string }
              - { label: Categoria, name: category, widget: string, default: Under 14 }
              - { label: Risultato, name: score, widget: string, required: false }
      - name: under13
        label: Under 13
        file: content/matches/under-13.md
        fields:
          - { label: Titolo interno, name: title, widget: string, default: Partite U13 }
          - { label: Squadra (non cambiare), name: team_slug, widget: string, default: under-13 }
          - label: Partite
            name: events
            widget: list
            required: false
            fields:
              - { label: Partita, name: title, widget: string }
              - { label: Data, name: date, widget: string, pattern: ["^\\d{4}-\\d{2}-\\d{2}$", "Scrivi la data come AAAA-MM-GG"] }
              - { label: Ora, name: time, widget: string, pattern: ["^\\d{1,2}:\\d{2}$", "Scrivi l'ora come HH:MM"] }
              - { label: Luogo, name: location, widget: string }
              - { label: Categoria, name: category, widget: string, default: Under 13 }
              - { label: Risultato, name: score, widget: string, required: false }

  # ---------------------------------------------------------------- CLASSIFICHE
  - name: classifiche
    label: Classifiche
    folder: content/standings
    extension: md
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Titolo (es. DR1 Girone B)", name: title, widget: string }
      - { label: "Squadra (es. dr1, under-17)", name: team_slug, widget: string, hint: "Deve essere uguale al nome della pagina della squadra." }
      - label: Righe della classifica
        name: table
        widget: list
        required: false
        fields:
          - { label: Posizione, name: rank, widget: number, value_type: int }
          - { label: Squadra, name: team, widget: string }
          - { label: Punti, name: points, widget: number, value_type: int }
          - { label: Giocate, name: played, widget: number, value_type: int, required: false }
          - { label: Vinte, name: won, widget: number, value_type: int, required: false }
          - { label: Perse, name: lost, widget: number, value_type: int, required: false }

  # ---------------------------------------------------------------- GALLERIA
  - name: album
    label: Foto - album
    label_singular: Album
    folder: content/albums
    extension: md
    create: true
    slug: "{{slug}}"
    media_folder: /content/gallery/uploads
    public_folder: /uploads
    summary: "{{season}} · {{title}}"
    fields:
      - { label: "Titolo dell'album", name: title, widget: string, hint: "Esempio: DR1 - Virtus Velletri vs Casilino 23" }
      - { label: Stagione, name: season, widget: select, options: ["2026-27", "2027-28", "2028-29"], default: "2026-27" }
      - { label: Foto, name: photos, widget: list, summary: "{{fields.image}}", field: { label: Foto, name: image, widget: image, allow_multiple: true }, hint: "Puoi scegliere piu foto insieme. Non serve ridimensionarle: lo fa il sito." }

  # ---------------------------------------------------------------- PAGINE
  - name: pagine
    label: Pagine (squadre, staff, testi)
    folder: content/pages
    extension: md
    create: false
    slug: "{{slug}}"
    fields:
      - { label: Titolo, name: title, widget: string }
      - { label: Descrizione, name: description, widget: text, required: false }
      - { label: Testo, name: body, widget: markdown, required: false }
      - label: Staff
        name: staff
        widget: list
        required: false
        fields:
          - { label: Ruolo, name: role, widget: string }
          - { label: Nome, name: name, widget: string }
          - { label: Foto, name: image, widget: image, required: false }
      - label: Giocatori
        name: roster
        widget: list
        required: false
        fields:
          - { label: Numero, name: number, widget: string, required: false }
          - { label: Nome, name: name, widget: string }
          - { label: Ruolo, name: position, widget: string, required: false }
          - { label: Anno, name: year, widget: string, required: false }
          - { label: Foto, name: image, widget: image, required: false }
